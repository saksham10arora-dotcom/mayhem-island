<title>Mayhem Island · Saksham Arora</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed drivable world; score card top-left, keys bottom-left, touch pads on phones. Single dusk look by choice. */
:root{
  --bg:#1b1440;
  --ink:#fff3e0;
  --dim:#c9bdf2;
  --panel:rgba(27,20,64,.66);
  --line:rgba(255,243,224,.2);
  --coral:#ff6b5e;
  --butter:#ffd166;
  --mint:#5eead4;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden;user-select:none;-webkit-user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg)}
.card{position:fixed;z-index:2;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:6px;pointer-events:none}
h1{margin:0;font:800 clamp(24px,4.6vw,44px)/1 var(--display);letter-spacing:-.03em;text-shadow:0 3px 0 rgba(27,20,64,.55)}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-variant-numeric:tabular-nums}
.stats span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;backdrop-filter:blur(8px)}
.stats b{color:var(--butter);font-weight:500}
.keys{position:fixed;z-index:2;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  font-size:11px;line-height:1.7;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 13px;
  backdrop-filter:blur(8px);pointer-events:none}
.keys kbd{font:500 11px var(--mono);color:var(--ink);background:rgba(255,243,224,.12);border-radius:5px;padding:1px 6px}
#toast{position:fixed;z-index:3;left:50%;top:22%;transform:translate(-50%,0) scale(.9);opacity:0;pointer-events:none;
  font:800 clamp(26px,6vw,60px)/1 var(--display);letter-spacing:-.02em;color:var(--butter);text-align:center;white-space:nowrap;
  text-shadow:0 4px 0 var(--coral),0 8px 30px rgba(0,0,0,.4);transition:opacity .25s,transform .25s}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
#portal{position:fixed;z-index:3;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font:500 14px var(--mono);color:var(--bg);background:var(--mint);border-radius:999px;padding:12px 20px;text-decoration:none;
  box-shadow:0 6px 0 rgba(27,20,64,.5)}
#portal:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.pads{position:fixed;z-index:2;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.pads div{display:flex;gap:10px;pointer-events:auto}
.pads button{width:64px;height:64px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font:500 22px var(--mono);backdrop-filter:blur(8px);touch-action:none}
.pads button.on{background:var(--butter);color:var(--bg)}
#err{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;text-align:center;background:var(--bg)}
@media (pointer:coarse){.pads{display:flex}.keys{display:none}}
</style>

<canvas id="stage" aria-label="Drivable 3D island"></canvas>
<div class="card">
  <h1>Mayhem Island</h1>
  <div class="stats"><span>wrecked <b id="smash">0</b> / <span id="total" style="all:unset">0</span></span><span><b id="kmh">0</b> km/h</span></div>
</div>
<div class="keys">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> drive · <kbd>Shift</kbd> boost · <kbd>Space</kbd> handbrake<br>
  <kbd>R</kbd> flip car back · <kbd>T</kbd> rebuild everything · scroll to zoom
</div>

<a id="portal" href="https://saksham.digital" target="_blank" rel="noopener" hidden>Open saksham.digital ↗</a>
<div class="pads" aria-hidden="true">
  <div><button id="pL" type="button">◀</button><button id="pR" type="button">▶</button></div>
  <div><button id="pB" type="button">▼</button><button id="pG" type="button">▲</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(function(){
const canvas=document.getElementById('stage');
let R;
try{ if(!window.THREE||!window.CANNON) throw 0; R=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }
catch(e){ document.getElementById('err').hidden=false; return; }
const small=Math.min(innerWidth,innerHeight)<600;
R.setPixelRatio(Math.min(devicePixelRatio||1,small?1.5:2));
R.outputEncoding=THREE.sRGBEncoding; R.toneMapping=THREE.NoToneMapping;
R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;

const C={sky0:'#2a1d66',sky1:'#8a4fb0',sky2:'#ff9e7a',ground:0x8f7fe8,groundDark:0x5a48b8,rock:0x3b2a86,
  coral:0xff6b5e,butter:0xffd166,mint:0x5eead4,cream:0xfff3e0,navy:0x1b1440,pink:0xff8fd0,sky:0x7cc4ff,leaf:0x3ddc97,trunk:0x7a4b3a};

/* ---------- scene ---------- */
const scene=new THREE.Scene();
(function(){ const c=document.createElement('canvas'); c.width=4; c.height=512; const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,512); gr.addColorStop(0,C.sky0); gr.addColorStop(.55,C.sky1); gr.addColorStop(1,C.sky2);
  g.fillStyle=gr; g.fillRect(0,0,4,512); const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; scene.background=t; })();
scene.fog=new THREE.Fog(0xe08a8a,150,460);
const cam=new THREE.PerspectiveCamera(42,1,.5,600);
scene.add(new THREE.HemisphereLight(0xffd0b8,0x3a2a98,.62));
const sun=new THREE.DirectionalLight(0xffdcae,1.05);
sun.castShadow=true; sun.shadow.mapSize.set(small?1024:2048,small?1024:2048);
const sc=sun.shadow.camera; sc.left=-42; sc.right=42; sc.top=42; sc.bottom=-42; sc.near=1; sc.far=140; sun.shadow.bias=-.0006; sun.shadow.normalBias=.04;
scene.add(sun,sun.target);

const mats={}; function mat(col){ return mats[col]||(mats[col]=new THREE.MeshStandardMaterial({color:col,roughness:.72,metalness:.02,flatShading:true})); }

/* ---------- physics ---------- */
const world=new CANNON.World();
world.broadphase=new CANNON.SAPBroadphase(world);
const G=-16; world.gravity.set(0,G,0); world.allowSleep=true; world.solver.iterations=10;
world.defaultContactMaterial.friction=.45; world.defaultContactMaterial.restitution=.12;
const mGround=new CANNON.Material('g'),mCar=new CANNON.Material('c'),mBall=new CANNON.Material('b');
world.addContactMaterial(new CANNON.ContactMaterial(mGround,mCar,{friction:.05,restitution:.05}));
world.addContactMaterial(new CANNON.ContactMaterial(mGround,mBall,{friction:.5,restitution:.62}));
world.addContactMaterial(new CANNON.ContactMaterial(mCar,mBall,{friction:.2,restitution:.5}));

const HALF=62;
(function(){ const b=new CANNON.Body({mass:0,material:mGround}); b.addShape(new CANNON.Box(new CANNON.Vec3(HALF,2,HALF))); b.position.set(0,-2,0); world.addBody(b); })();

/* island visuals */
(function(){
  const c=document.createElement('canvas'); c.width=c.height=1024; const g=c.getContext('2d');
  g.fillStyle='#6a58d6'; g.fillRect(0,0,1024,1024);
  for(let i=0;i<260;i++){ g.fillStyle=i%2?'rgba(84,68,196,.55)':'rgba(126,110,232,.5)'; const r=8+Math.random()*34;
    g.beginPath(); g.ellipse(Math.random()*1024,Math.random()*1024,r,r*.7,Math.random()*3,0,7); g.fill(); }
  g.strokeStyle='rgba(255,243,224,.75)'; g.lineWidth=7; g.setLineDash([26,22]); g.beginPath(); g.ellipse(512,512,330,330,0,0,7); g.stroke();
  g.setLineDash([]); g.strokeStyle='rgba(255,243,224,.9)'; g.lineWidth=10; g.strokeRect(14,14,996,996);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=8;
  const top=new THREE.Mesh(new THREE.BoxGeometry(HALF*2,4,HALF*2),[mat(C.groundDark),mat(C.groundDark),new THREE.MeshStandardMaterial({map:t,roughness:.9}),mat(C.groundDark),mat(C.groundDark),mat(C.groundDark)]);
  top.position.y=-2; top.receiveShadow=true; scene.add(top);
  const under=new THREE.Mesh(new THREE.ConeGeometry(HALF*Math.SQRT2,58,4,3),mat(C.rock)); under.rotation.set(Math.PI,Math.PI/4,0); under.position.y=-33; scene.add(under);
  for(let i=0;i<16;i++){ const a=i/16*6.283+Math.random(),r=120+Math.random()*90;
    const m=new THREE.Mesh(new THREE.DodecahedronGeometry(4+Math.random()*9,0),mat(i%3?C.rock:C.groundDark));
    m.position.set(Math.cos(a)*r,-30+Math.random()*50,Math.sin(a)*r); m.rotation.set(Math.random()*3,Math.random()*3,0); scene.add(m); }
})();
const clouds=[];
(function(){ const m=new THREE.MeshStandardMaterial({color:0xffe8f2,roughness:1,flatShading:true,transparent:true,opacity:.92});
  for(let i=0;i<14;i++){ const g=new THREE.Group(); for(let k=0;k<5;k++){ const s=new THREE.Mesh(new THREE.IcosahedronGeometry(3+Math.random()*4,0),m);
      s.position.set(k*4.5-9+Math.random()*2,Math.random()*2,Math.random()*4); g.add(s); }
    const a=i/14*6.283; const r=95+Math.random()*70; g.position.set(Math.cos(a)*r,-18+Math.random()*34,Math.sin(a)*r); g.userData.s=.6+Math.random(); scene.add(g); clouds.push(g); } })();

/* ---------- props ---------- */
const props=[]; let total=0;
function addProp(mesh,shape,mass,x,y,z,q,opt){
  opt=opt||{};
  const b=new CANNON.Body({mass,material:opt.mat}); b.addShape(shape); b.position.set(x,y,z); if(q) b.quaternion.copy(q);
  b.allowSleep=true; b.sleepSpeedLimit=.35; b.sleepTimeLimit=.6; b.linearDamping=opt.ld||.05; b.angularDamping=opt.ad||.1;
  world.addBody(b); if(mass>0&&!opt.awake) b.sleep();
  mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh);
  const p={mesh,body:b,home:b.position.clone(),homeQ:b.quaternion.clone(),count:mass>0&&!opt.nocount,hit:false,off:opt.off||0};
  if(p.count) total++; props.push(p); sync(p); return p;
}
function sync(p){ p.mesh.position.copy(p.body.position); p.mesh.quaternion.copy(p.body.quaternion); if(p.off){ p.mesh.position.y+=0; } }
const boxG={}; function bg(w,h,d){ const k=w+'_'+h+'_'+d; return boxG[k]||(boxG[k]=new THREE.BoxGeometry(w,h,d)); }
function box(w,h,d,x,y,z,col,mass,q,opt){ return addProp(new THREE.Mesh(bg(w,h,d),mat(col)),new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2)),mass,x,y,z,q,opt); }
const sphG={}; function ball(r,x,y,z,col,mass,opt){ const g=sphG[r]||(sphG[r]=new THREE.IcosahedronGeometry(r,2));
  return addProp(new THREE.Mesh(g,mat(col)),new CANNON.Sphere(r),mass,x,y,z,null,Object.assign({mat:mBall,ld:.12,ad:.2},opt||{})); }
function qY(a){ const q=new CANNON.Quaternion(); q.setFromAxisAngle(new CANNON.Vec3(0,1,0),a); return q; }

function label(text,x,z,size,rot,col){
  const c=document.createElement('canvas'); c.width=1024; c.height=256; const g=c.getContext('2d');
  g.font='800 170px "Bricolage Grotesque","Arial Black",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle=col||'#fff3e0'; g.fillText(text,512,138);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=8;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(size,size/4),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,opacity:.92,fog:true}));
  m.rotation.set(-Math.PI/2,0,rot||0); m.position.set(x,.03,z); scene.add(m);
}

/* giant smashable name */
const FONT={S:['01111','10000','10000','01110','00001','00001','11110'],A:['01110','10001','10001','11111','10001','10001','10001'],
  K:['10001','10010','10100','11000','10100','10010','10001'],H:['10001','10001','10001','11111','10001','10001','10001'],M:['10001','11011','10101','10101','10001','10001','10001']};
(function(){ const word='SAKSHAM',s=1.05,cols=[C.coral,C.butter,C.mint,C.pink,C.sky,C.cream,C.coral]; const w=word.length*6-1; let i=0;
  for(const ch of word){ const f=FONT[ch]; for(let r=0;r<7;r++) for(let c=0;c<5;c++) if(f[r][c]==='1')
      box(s,s,s,(i*6+c-w/2+.5)*s*-1,(6-r+.5)*s,26,cols[i],1.1);
    i++; } })();

/* bowling */
(function(){ const pinG=new THREE.LatheGeometry([[0,0],[.3,0],[.36,.5],[.2,1.0],[.14,1.2],[.22,1.42],[.14,1.6],[0,1.62]].map(p=>new THREE.Vector2(p[0],p[1]-.8)),10);
  let n=0; for(let r=0;r<4;r++) for(let k=0;k<=r;k++){ const m=new THREE.Mesh(pinG,mat(n++%2?C.cream:C.coral));
      addProp(m,new CANNON.Box(new CANNON.Vec3(.3,.8,.3)),1.2,-38+(k-r/2)*1.25,.8,10+r*1.1,null); }
  ball(1.5,-38,1.5,-12,C.navy,14);
  const lane=new THREE.Mesh(new THREE.PlaneGeometry(7,34),new THREE.MeshBasicMaterial({color:C.cream,transparent:true,opacity:.22,depthWrite:false}));
  lane.rotation.x=-Math.PI/2; lane.position.set(-38,.02,-1); scene.add(lane);
  label('BOWL',-38,-22,12,Math.PI,'#ffd166'); })();

/* crate pyramid */
(function(){ const s=1.6, cols=[C.butter,C.mint,C.pink,C.sky,C.coral]; for(let l=0;l<5;l++){ const n=5-l; for(let a=0;a<n;a++) for(let b=0;b<n;b++)
      box(s,s,s,36+(a-(n-1)/2)*s,s/2+l*s,6+(b-(n-1)/2)*s,cols[l],2.2); }
  label('WRECK IT',36,-3,16,Math.PI,'#5eead4'); })();

/* dominoes */
(function(){ let a=0; for(let i=0;i<46;i++){ const r=5+a*1.55; a+=1.45/r; const x=32+Math.cos(a)*r, z=-32+Math.sin(a)*r;
    box(1.3,2.4,.3,x,1.2,z,[C.cream,C.coral,C.butter,C.mint][i%4],1.4,qY(-a+.25)); }
  label('PUSH ONE',32,-52,16,Math.PI,'#ff8fd0'); })();

/* ball pit + goal */
(function(){ const cols=[C.coral,C.butter,C.mint,C.pink,C.sky];
  for(let i=0;i<14;i++) ball(.9+((i*7)%5)*.22,-34+((i*37)%11-5)*1.9,2,-30+((i*53)%9-4)*1.9,cols[i%5],1.6);
  ball(3.2,-22,3.2,-40,C.cream,9);
  box(.6,6,.6,-46,3,-52,C.cream,0); box(.6,6,.6,-30,3,-52,C.cream,0); box(16.6,.6,.6,-38,6.3,-52,C.cream,0);
  label('GOAL',-38,-56,10,Math.PI,'#fff3e0'); })();

/* ramp + hoop */
const hoop=new THREE.Vector3(0,6.4,-37);
(function(){ const q=new CANNON.Quaternion(); q.setFromAxisAngle(new CANNON.Vec3(1,0,0),.3);
  box(9,.5,14,0,1.82,-22,C.coral,0,q);
  const t=new THREE.Mesh(new THREE.TorusGeometry(4.2,.45,8,28),new THREE.MeshStandardMaterial({color:C.butter,emissive:0xff8a00,emissiveIntensity:.9,flatShading:true}));
  t.position.copy(hoop); t.castShadow=true; scene.add(t);
  box(.5,2.2,.5,-4.4,1.1,-37,C.cream,0); box(.5,2.2,.5,4.4,1.1,-37,C.cream,0);
  label('FULL SEND',0,-11.5,16,Math.PI,'#ffd166'); })();

/* trees */
(function(){ const spots=[[-52,48],[-20,50],[18,52],[52,50],[55,22],[56,-14],[54,-52],[14,-56],[-14,-57],[-56,-20],[-55,14],[-52,-56],[20,40],[-22,38],[48,-30],[-50,-8]];
  spots.forEach((s,i)=>{ const g=new THREE.Group(); const tr=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,2,6),mat(C.trunk)); tr.position.y=-1.5; tr.castShadow=true; g.add(tr);
    const h=3+((i*13)%5)*.5; const co=new THREE.Mesh(new THREE.ConeGeometry(1.9,h,6),mat(i%3?C.leaf:C.mint)); co.position.y=-.5+h/2; co.castShadow=true; g.add(co);
    addProp(g,new CANNON.Box(new CANNON.Vec3(.55,2.5,.55)),3,s[0],2.5,s[1],null,{ad:.3}); }); })();

/* pads: boost, moon, chaos, portal */
const pads=[];
function pad(x,z,r,col,kind,text){ const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r+.3,.3,24),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.18,flatShading:true}));
  m.position.set(x,.15,z); m.receiveShadow=true; scene.add(m); pads.push({x,z,r,kind,m,cool:0}); if(text) label(text,x,z-r-2.4,12,Math.PI,'#fff3e0'); }
pad(44,42,3,C.coral,'chaos','DO NOT PRESS');
pad(-44,42,3,C.sky,'moon','MOON MODE');
pad(0,-6,2.6,C.mint,'boost','');
const mono=new THREE.Mesh(new THREE.BoxGeometry(5,11,1.2),new THREE.MeshStandardMaterial({color:C.navy,emissive:C.mint,emissiveIntensity:.35,roughness:.3,flatShading:true}));
mono.position.set(0,5.5,50); mono.castShadow=true; scene.add(mono);
(function(){ const b=new CANNON.Body({mass:0}); b.addShape(new CANNON.Box(new CANNON.Vec3(2.5,5.5,.6))); b.position.set(0,5.5,50); world.addBody(b); })();
label('THE REST OF ME',0,44,18,Math.PI,'#5eead4');
label('DRIVE INTO THINGS',0,9,22,Math.PI,'#fff3e0');

/* ---------- car ---------- */
const chassis=new CANNON.Body({mass:150,material:mCar});
chassis.addShape(new CANNON.Box(new CANNON.Vec3(.95,.32,1.95)),new CANNON.Vec3(0,.22,0));
chassis.addShape(new CANNON.Box(new CANNON.Vec3(.75,.3,.9)),new CANNON.Vec3(0,.84,-.25));
chassis.allowSleep=false; chassis.angularDamping=.35; chassis.linearDamping=.02;
const vehicle=new CANNON.RaycastVehicle({chassisBody:chassis,indexRightAxis:0,indexUpAxis:1,indexForwardAxis:2});
const wopt={radius:.46,directionLocal:new CANNON.Vec3(0,-1,0),suspensionStiffness:34,suspensionRestLength:.34,frictionSlip:2.6,
  dampingRelaxation:2.4,dampingCompression:4.4,maxSuspensionForce:1e5,rollInfluence:.02,axleLocal:new CANNON.Vec3(-1,0,0),
  chassisConnectionPointLocal:new CANNON.Vec3(),maxSuspensionTravel:.32,customSlidingRotationalSpeed:-30,useCustomSlidingRotationalSpeed:true};
[[.9,1.28],[-.9,1.28],[.9,-1.28],[-.9,-1.28]].forEach(p=>{ wopt.chassisConnectionPointLocal.set(p[0],.02,p[1]); vehicle.addWheel(wopt); });
vehicle.addToWorld(world);
const car=new THREE.Group(); scene.add(car);
(function(){ const add=(g,m,x,y,z)=>{ const o=new THREE.Mesh(g,m); o.position.set(x,y,z); o.castShadow=true; car.add(o); return o; };
  add(bg(1.9,.64,3.9),mat(C.butter),0,.22,0); add(bg(1.5,.6,1.8),mat(C.navy),0,.84,-.25);
  add(bg(1.56,.08,1.86),mat(C.butter),0,1.17,-.25); add(bg(2,.22,.3),mat(C.navy),0,.05,1.95); add(bg(2,.22,.3),mat(C.navy),0,.05,-1.95);
  const hl=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff0b0,emissiveIntensity:1.6}); add(bg(.38,.22,.08),hl,.6,.3,1.96); add(bg(.38,.22,.08),hl,-.6,.3,1.96);
  const tl=new THREE.MeshStandardMaterial({color:C.coral,emissive:C.coral,emissiveIntensity:1.2}); add(bg(.38,.18,.08),tl,.6,.32,-1.96); add(bg(.38,.18,.08),tl,-.6,.32,-1.96);
  add(bg(1.7,.08,.5),mat(C.coral),0,1.0,-1.75); })();
const wheelG=new THREE.CylinderGeometry(.46,.46,.36,14); wheelG.rotateZ(Math.PI/2);
const hubG=new THREE.CylinderGeometry(.2,.2,.38,8); hubG.rotateZ(Math.PI/2);
const wheels=vehicle.wheelInfos.map(()=>{ const g=new THREE.Group(); const t=new THREE.Mesh(wheelG,mat(C.navy)); t.castShadow=true; g.add(t); g.add(new THREE.Mesh(hubG,mat(C.cream))); scene.add(g); return g; });
function spawn(keep){ if(keep){ chassis.position.y+=1.6; } else chassis.position.set(0,1.6,2);
  const f=keep?new CANNON.Vec3(0,0,1):null; let yaw=0; if(keep){ chassis.quaternion.vmult(f,f); yaw=Math.atan2(f.x,f.z); }
  chassis.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0),yaw); chassis.velocity.set(0,0,0); chassis.angularVelocity.set(0,0,0); }
spawn(false);

/* ---------- chaos balls ---------- */
const rain=[]; function chaos(){ const cols=[C.coral,C.butter,C.mint,C.pink,C.sky,C.cream];
  for(let i=0;i<(small?28:48);i++){ const x=chassis.position.x+(Math.random()-.5)*46,z=chassis.position.z+(Math.random()-.5)*46,y=18+Math.random()*30;
    let p=rain[i]; if(!p){ p=ball(.8+Math.random()*.9,x,y,z,cols[i%6],1.2,{nocount:true,awake:true}); rain[i]=p; }
    p.body.position.set(Math.max(-58,Math.min(58,x)),y,Math.max(-58,Math.min(58,z))); p.body.velocity.set(0,-4,0); p.body.wakeUp(); } }

/* ---------- input ---------- */
const keys={}; const map={ArrowUp:'w',ArrowDown:'s',ArrowLeft:'a',ArrowRight:'d'};
addEventListener('keydown',e=>{ const k=map[e.key]||e.key.toLowerCase(); if(['w','a','s','d',' '].includes(k)||map[e.key]) e.preventDefault();
  if(!keys[k]){ if(k==='r') spawn(chassis.position.y>-6); if(k==='t') rebuild(); } keys[k]=true; });
addEventListener('keyup',e=>{ keys[map[e.key]||e.key.toLowerCase()]=false; });
addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; });
[['pL','a'],['pR','d'],['pG','w'],['pB','s']].forEach(([id,k])=>{ const b=document.getElementById(id);
  const on=e=>{ e.preventDefault(); keys[k]=true; b.classList.add('on'); }, off=()=>{ keys[k]=false; b.classList.remove('on'); };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off); });
let zoomK=1.12; canvas.addEventListener('wheel',e=>{ e.preventDefault(); zoomK=Math.min(2.2,Math.max(.55,zoomK*Math.exp(e.deltaY*.001))); },{passive:false});

/* ---------- hud ---------- */
const smashEl=document.getElementById('smash'),kmhEl=document.getElementById('kmh'),toastEl=document.getElementById('toast'),portalEl=document.getElementById('portal');
document.getElementById('total').textContent=total;
let toastT=0; function toast(s){ toastEl.textContent=s; toastEl.classList.add('on'); toastT=1.6; }
function rebuild(){ for(const p of props){ if(p.body.mass===0) continue; p.body.position.copy(p.home); p.body.quaternion.copy(p.homeQ); p.body.velocity.set(0,0,0); p.body.angularVelocity.set(0,0,0);
    if(rain.includes(p)) p.body.position.y=-200; p.body.sleep(); p.hit=false; } smashed=0; smashEl.textContent=0; toast('REBUILT'); }

/* ---------- loop ---------- */
let lw=0,lh=0; function resize(){ const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight; if(w===lw&&h===lh) return; lw=w; lh=h; R.setSize(w,h,false); cam.aspect=w/h; cam.fov=w<h?58:42; cam.updateProjectionMatrix(); }
const tmpV=new CANNON.Vec3(), fwd=new CANNON.Vec3(), up=new CANNON.Vec3();
const camPos=new THREE.Vector3(26,28,-30), camLook=new THREE.Vector3();
let last=performance.now()/1000, steer=0, smashed=0, tick=0, moon=0, flipT=0, hoopCool=0, milestone=0;
function frame(ms){
  requestAnimationFrame(frame);
  const now=ms/1000, dt=Math.min(.05,Math.max(.001,now-last)); last=now; resize();

  /* drive */
  chassis.quaternion.vmult(new CANNON.Vec3(0,0,1),fwd); chassis.quaternion.vmult(new CANNON.Vec3(0,1,0),up);
  const v=chassis.velocity, speed=v.length(), fs=v.dot(fwd);
  const thr=(keys.w?1:0)-(keys.s?1:0), boost=keys.shift?1.9:1;
  const maxF=1500*boost*Math.max(0,1-Math.abs(fs)/(keys.shift?36:25));
  const f=thr*maxF; vehicle.applyEngineForce(-f,2); vehicle.applyEngineForce(-f,3); vehicle.applyEngineForce(-f*.4,0); vehicle.applyEngineForce(-f*.4,1);
  const st=((keys.a?1:0)-(keys.d?1:0))*(.55-.3*Math.min(1,speed/30)); steer+=(st-steer)*Math.min(1,dt*9);
  vehicle.setSteeringValue(steer,0); vehicle.setSteeringValue(steer,1);
  const hb=keys[' ']?28:(thr===0?1.2:0); vehicle.setBrake(hb*.3,0); vehicle.setBrake(hb*.3,1); vehicle.setBrake(hb,2); vehicle.setBrake(hb,3);

  /* pads */
  for(const p of pads){ p.cool-=dt; const dx=chassis.position.x-p.x,dz=chassis.position.z-p.z; const inside=dx*dx+dz*dz<p.r*p.r&&chassis.position.y<2.5;
    p.m.position.y=inside?.04:.15;
    if(inside&&p.cool<=0){ p.cool=p.kind==='boost'?1:5;
      if(p.kind==='chaos'){ chaos(); toast('TOLD YOU'); }
      else if(p.kind==='moon'){ moon=10; toast('MOON MODE'); }
      else { const k=13; v.x+=fwd.x*k; v.z+=fwd.z*k; toast('WHOOSH'); } } }
  if(moon>0){ moon-=dt; world.gravity.set(0,G*.22,0); if(moon<=0){ world.gravity.set(0,G,0); toast('GRAVITY IS BACK'); } }
  hoopCool-=dt; if(hoopCool<=0&&Math.abs(chassis.position.z-hoop.z)<1.2&&Math.hypot(chassis.position.x-hoop.x,chassis.position.y-hoop.y)<3.9){ hoopCool=3; toast('THROUGH THE HOOP'); }

  world.step(1/60,dt,3);

  /* recover */
  if(chassis.position.y<-40){ spawn(false); toast('GRAVITY WINS'); }
  if(up.y<.25&&speed<2.5){ flipT+=dt; if(flipT>1.6){ spawn(true); flipT=0; } } else flipT=0;

  /* sync */
  car.position.copy(chassis.position); car.quaternion.copy(chassis.quaternion);
  for(let i=0;i<4;i++){ vehicle.updateWheelTransform(i); const t=vehicle.wheelInfos[i].worldTransform; wheels[i].position.copy(t.position); wheels[i].quaternion.copy(t.quaternion); }
  for(const p of props){ if(p.body.mass===0) continue; if(p.body.sleepState===2&&p.synced) continue; sync(p); p.synced=p.body.sleepState===2;
    if(p.body.position.y<-60){ p.body.velocity.set(0,0,0); p.body.sleep(); } }
  if(++tick%15===0){ for(const p of props){ if(!p.count||p.hit) continue; const b=p.body.position,h=p.home; const d=(b.x-h.x)*(b.x-h.x)+(b.y-h.y)*(b.y-h.y)+(b.z-h.z)*(b.z-h.z);
      if(d>2.2){ p.hit=true; smashed++; } }
    smashEl.textContent=smashed; kmhEl.textContent=Math.round(speed*3.6);
    const ms2=Math.floor(smashed/50); if(ms2>milestone){ milestone=ms2; toast(smashed>=total?'TOTAL MAYHEM':smashed+' WRECKED'); } if(ms2<milestone) milestone=ms2;
    const near=Math.hypot(chassis.position.x,chassis.position.z-50)<9; if(portalEl.hidden===near) portalEl.hidden=!near; }
  if(toastT>0){ toastT-=dt; if(toastT<=0) toastEl.classList.remove('on'); }

  /* camera + light */
  const k=zoomK*(1+Math.min(1,speed/40)*.18);
  const tx=chassis.position.x+17*k, ty=Math.max(chassis.position.y,0)+21*k, tz=chassis.position.z-23*k;
  const a=Math.min(1,dt*4.5); camPos.x+=(tx-camPos.x)*a; camPos.y+=(ty-camPos.y)*a; camPos.z+=(tz-camPos.z)*a;
  camLook.x+=(chassis.position.x+v.x*.18-camLook.x)*a; camLook.y+=(Math.max(chassis.position.y,-4)-camLook.y)*a; camLook.z+=(chassis.position.z+v.z*.18-camLook.z)*a;
  cam.position.copy(camPos); cam.lookAt(camLook);
  sun.target.position.set(camLook.x,0,camLook.z); sun.position.set(camLook.x-28,46,camLook.z-18);
  for(const c of clouds){ c.position.x+=dt*c.userData.s; if(c.position.x>190) c.position.x=-190; }
  R.render(scene,cam);
}
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
})();
</script>
</body>
